map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream sdm_bff       { server bff:5174; }
upstream sdm_portal    { server portal:8080; }
upstream sdm_workspace { server workspace:8080; }

# Shared proxy headers + SSE-friendly buffering for the BFF.
# Included from every server block via `include /etc/nginx/snippets/...`.
# Inline here because nginx:alpine has no snippets/ dir by default.

# Portal — host port 88
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 16M;
    server_tokens off;

    # SSE channel — long-lived, no buffering.
    location = /api/events {
        proxy_pass http://sdm_bff;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        chunked_transfer_encoding off;
    }

    # BFF surface (/api/* /auth/* /me /me/* /config /health* /readyz)
    location ~ ^/(api|auth|me|config|health|healthz|readyz)(/|$) {
        proxy_pass http://sdm_bff;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://sdm_portal;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Workspace — host port 89

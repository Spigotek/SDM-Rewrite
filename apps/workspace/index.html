<!doctype html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SDM Workspace</title>
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/inter-variable-latin.woff2"
      crossorigin
    />
    <!-- K-fix CLS — Slovak diacritics (Pohľad, Uložiť, ľ ĺ) on every workspace
         route trigger latin-ext. Preloading it cuts the late font-swap layout
         shift (~0.056 of CLS on /queue per Lighthouse audit). -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/inter-variable-latin-ext.woff2"
      crossorigin
    />
    <!-- K-fix CLS — JetBrains Mono is used for tabular-nums on the queue ref
         column (#10001) and shifts the toolbar-trailing when the swap lands
         post-LCP. Preload both subsets. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/jetbrains-mono-variable-latin.woff2"
      crossorigin
    />
    <script>
      (function () {
        try {
          var k = "sdm.theme";
          var s = localStorage.getItem(k);
          var t;
          if (s === "dark" || s === "light" || s === "hc") {
            t = s;
          } else if (matchMedia("(prefers-contrast: more)").matches) {
            t = "hc";
          } else if (matchMedia("(prefers-color-scheme: dark)").matches) {
            t = "dark";
          } else {
            t = "light";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body data-density="compact">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

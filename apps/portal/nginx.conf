server {
    listen 8080 default_server;
    listen [::]:8080 default_server;

    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static assets — long cache for fingerprinted files.
    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # PWA manifest — nginx's stock mime.types ships no entry for `.webmanifest`,
    # so without this block the file goes out as `application/octet-stream` and
    # Chrome refuses to honor it. RFC 9239 / W3C App-Manifest spec mandate
    # `application/manifest+json`.
    location = /manifest.webmanifest {
        types { } default_type "application/manifest+json";
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # K8s healthcheck endpoint.
    location = /healthz {
        access_log off;
        return 200 '{"status":"ok","service":"@sdm/portal"}';
        default_type application/json;
    }

    # SPA fallback — every other route serves index.html (client-side router).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Hardening
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

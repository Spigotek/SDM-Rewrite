name: acceptance

# 18 user-journey acceptance smoke (per `qa-test-strategy/acceptance-criteria.md §2`)
# + I.2 multi-browser matrix.
#
# Runs the Phase H exit gate against MSW-mocked SPAs across chromium, firefox,
# and webkit so we catch vendor-specific regressions before the live BFF
# smoke (separate `acceptance-live.yml`, manual-trigger only).
#
# Per H.16 baseline: ~30 s per spec × 18 specs ≈ 9 min wall on chromium.
# 3-browser fan-out via `strategy.matrix` parallelises across runners so
# total wall time stays in the same envelope.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.11.0"
  PNPM_VERSION: "9.12.0"

jobs:
  smoke:
    name: 18 journey scenarios (MSW mode) — ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      # I.2 — cache Playwright browser binaries keyed on the package version
      # plus the matrix browser. Cache-miss installs only the matrix entry
      # (~60 MB / browser vs. ~600 MB for the full set).
      - name: Resolve Playwright version
        id: pw-version
        run: |
          v=$(node -p "require('./tools/browser-test/package.json').dependencies['@playwright/test']")
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers (${{ matrix.browser }})
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ matrix.browser }}-${{ steps.pw-version.outputs.version }}

      - name: Install Playwright ${{ matrix.browser }} (with system deps)
        run: pnpm --filter @sdm/browser-test exec playwright install --with-deps ${{ matrix.browser }}

      # Build the SPAs with MSW bootstrap baked in. `import.meta.env` is
      # replaced at build time, so the flag must be set here (not at preview).
      - name: Build apps (VITE_USE_MOCKS=true)
        env:
          VITE_USE_MOCKS: "true"
        run: pnpm build

      - name: Start portal preview (:5173)
        run: pnpm --filter @sdm/portal preview &

      - name: Start workspace preview (:5175)
        run: pnpm --filter @sdm/workspace preview &

      - name: Wait for preview servers
        run: |
          set -e
          for url in http://localhost:5173/ http://localhost:5175/; do
            for i in $(seq 1 60); do
              if curl -fsI "$url" >/dev/null 2>&1; then
                echo "$url ready"
                break
              fi
              if [ "$i" = "60" ]; then
                echo "$url never became ready"
                exit 1
              fi
              sleep 1
            done
          done

      - name: Verify MSW worker reachable (both SPAs)
        run: |
          curl -fsI http://localhost:5173/mockServiceWorker.js
          curl -fsI http://localhost:5175/mockServiceWorker.js

      - name: Portal acceptance journeys (1-3) on :5173
        env:
          SDM_BROWSER_TEST_RUN_ID: "p-${{ matrix.browser }}"
          SDM_BROWSER_TEST_BASE_URL: "http://localhost:5173"
        working-directory: tools/browser-test
        run: |
          pnpm exec playwright test \
            scenarios/acceptance/journey-01-portal-incident.spec.ts \
            scenarios/acceptance/journey-02-portal-request-software.spec.ts \
            scenarios/acceptance/journey-03-portal-kb-self-help.spec.ts \
            --config=playwright.config.ts \
            --project=${{ matrix.browser }} \
            --reporter=list

      - name: Workspace acceptance journeys (4-18) on :5175
        if: success() || failure()
        env:
          SDM_BROWSER_TEST_RUN_ID: "w-${{ matrix.browser }}"
          SDM_BROWSER_TEST_BASE_URL: "http://localhost:5175"
        working-directory: tools/browser-test
        run: |
          pnpm exec playwright test \
            scenarios/acceptance/journey-04-workspace-triage.spec.ts \
            scenarios/acceptance/journey-05-workspace-resolve-cmdb.spec.ts \
            scenarios/acceptance/journey-06-workspace-escalate-l2.spec.ts \
            scenarios/acceptance/journey-07-workspace-problem-rca.spec.ts \
            scenarios/acceptance/journey-08-workspace-cmdb-impact.spec.ts \
            scenarios/acceptance/journey-09-workspace-incident-deepdive.spec.ts \
            scenarios/acceptance/journey-10-workspace-change-cab-prep.spec.ts \
            scenarios/acceptance/journey-11-workspace-change-emergency.spec.ts \
            scenarios/acceptance/journey-12-workspace-change-cross-tenant.spec.ts \
            scenarios/acceptance/journey-13-workspace-kb-author-new.spec.ts \
            scenarios/acceptance/journey-14-workspace-kb-from-incident.spec.ts \
            scenarios/acceptance/journey-15-workspace-kb-analytics.spec.ts \
            scenarios/acceptance/journey-16-workspace-cmdb-ci-detail.spec.ts \
            scenarios/acceptance/journey-17-workspace-cmdb-relationships.spec.ts \
            scenarios/acceptance/journey-18-workspace-cmdb-cross-tenant.spec.ts \
            --config=playwright.config.ts \
            --project=${{ matrix.browser }} \
            --reporter=list

      - name: Upload artefacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-${{ matrix.browser }}-artefacts
          path: |
            .playwright/runs/
            tools/browser-test/test-results/
          retention-days: 7

  # I.2 — security browser scenarios (axe sweeps + cross-tab + CSRF +
  # session-refresh). axe is browser-agnostic, the BroadcastChannel /
  # CSRF / refresh contracts run on chromium only (see per-spec
  # `test.skip(({ browserName }) => …)` guards). Split into its own job
  # so a vendor-specific failure in the journey matrix doesn't mask an
  # a11y regression and vice versa.
  security:
    name: security browser scenarios (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Resolve Playwright version
        id: pw-version
        run: |
          v=$(node -p "require('./tools/browser-test/package.json').dependencies['@playwright/test']")
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers (chromium)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-chromium-${{ steps.pw-version.outputs.version }}

      - name: Install Playwright chromium (with system deps)
        run: pnpm --filter @sdm/browser-test exec playwright install --with-deps chromium

      - name: Build apps (VITE_USE_MOCKS=true)
        env:
          VITE_USE_MOCKS: "true"
        run: pnpm build

      - name: Start portal preview (:5173)
        run: pnpm --filter @sdm/portal preview &

      - name: Start workspace preview (:5175)
        run: pnpm --filter @sdm/workspace preview &

      - name: Wait for preview servers
        run: |
          set -e
          for url in http://localhost:5173/ http://localhost:5175/; do
            for i in $(seq 1 60); do
              if curl -fsI "$url" >/dev/null 2>&1; then
                echo "$url ready"
                break
              fi
              if [ "$i" = "60" ]; then
                echo "$url never became ready"
                exit 1
              fi
              sleep 1
            done
          done

      - name: Portal security scenarios (axe + cross-tab + csrf + refresh)
        env:
          SDM_BROWSER_TEST_RUN_ID: "sec-portal"
          SDM_BROWSER_TEST_BASE_URL: "http://localhost:5173"
        working-directory: tools/browser-test
        run: |
          pnpm exec playwright test \
            scenarios/security/axe-sweep-portal.spec.ts \
            scenarios/security/cross-tab-logout.spec.ts \
            scenarios/security/cross-tab-tenant-sync.spec.ts \
            scenarios/security/csrf-mutation.spec.ts \
            scenarios/security/session-refresh-silent.spec.ts \
            --config=playwright.config.ts \
            --project=chromium \
            --reporter=list

      - name: Workspace security scenarios (axe sweep)
        if: success() || failure()
        env:
          SDM_BROWSER_TEST_RUN_ID: "sec-workspace"
          SDM_BROWSER_TEST_BASE_URL: "http://localhost:5175"
        working-directory: tools/browser-test
        run: |
          pnpm exec playwright test \
            scenarios/security/axe-sweep-workspace.spec.ts \
            --config=playwright.config.ts \
            --project=chromium \
            --reporter=list

      - name: Upload artefacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: security-artefacts
          path: |
            .playwright/runs/
            tools/browser-test/test-results/
          retention-days: 7

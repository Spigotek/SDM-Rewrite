name: acceptance

# 18 user-journey acceptance smoke (per `qa-test-strategy/acceptance-criteria.md §2`).
# Runs the Phase H exit gate against MSW-mocked SPAs. Live BFF + CA SDM
# smoke is the separate `acceptance-live.yml` workflow (manual-trigger
# only). Per H.16: ~30 s per spec × 18 specs ≈ 9 min wall — kept on its
# own workflow off the critical-path `ci.yml`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.11.0"
  PNPM_VERSION: "9.12.0"

jobs:
  smoke:
    name: 18 journey scenarios (MSW mode)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install Playwright browser (Chromium only)
        run: pnpm --filter @sdm/browser-test exec playwright install --with-deps chromium

      # Build the SPAs with MSW bootstrap baked in. `import.meta.env` is
      # replaced at build time, so the flag must be set here (not at preview).
      - name: Build apps (VITE_USE_MOCKS=true)
        env:
          VITE_USE_MOCKS: "true"
        run: pnpm build

      # Start the portal preview server (the journey specs target port 5173
      # which is portal; workspace journeys also target portal because the
      # MSW worker + the route tree both ship from the portal bundle in MVP).
      - name: Start preview server (portal :5173)
        run: pnpm --filter @sdm/portal preview &
        # `&` backgrounds — the next step waits on readiness.

      - name: Wait for preview server
        run: |
          for i in $(seq 1 30); do
            if curl -fsI http://localhost:5173/ >/dev/null 2>&1; then
              echo "preview server ready"
              exit 0
            fi
            sleep 1
          done
          echo "preview server did not become ready"
          exit 1

      - name: Verify MSW worker reachable
        run: curl -fsI http://localhost:5173/mockServiceWorker.js

      - name: Run 18 acceptance journey scenarios
        env:
          SDM_BROWSER_TEST_RUN_ID: "ci0001"
          SDM_BROWSER_TEST_BASE_URL: "http://localhost:5173"
        working-directory: tools/browser-test
        run: |
          pnpm exec playwright test scenarios/acceptance \
            --config=playwright.config.ts \
            --reporter=list

      - name: Upload artefacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-playwright-artefacts
          path: |
            .playwright/runs/ci0001/
            tools/browser-test/test-results/
          retention-days: 7
